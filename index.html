<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paracity | Newark Asset Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-black text-white antialiased">

    <nav class="p-8 flex justify-between items-center border-b border-white/10">
        <div class="text-2xl font-black tracking-tighter uppercase italic">PARA<span class="text-teal-500">CITY</span></div>
        <a href="https://sgidisu.github.io/paracity/" class="text-xs font-bold text-slate-400 hover:text-white uppercase tracking-widest transition">Main Page</a>
    </nav>

    <main class="max-w-5xl mx-auto py-24 px-6">
        <h1 class="text-6xl md:text-8xl font-black tracking-tight mb-8">NEWARK <br><span class="text-teal-500 italic">PORTFOLIO</span></h1>
        <p class="text-xl text-slate-400 mb-12 max-w-xl border-l-2 border-teal-500 pl-6">Institutional transparency for commercial partners. Secure access to property audits and NOI reporting.</p>

        <div class="grid md:grid-cols-3 gap-4">
            <div class="p-8 bg-white/5 border border-white/10 rounded-2xl">
                <div class="text-teal-500 font-bold mb-4">01. NOI</div>
                <p class="text-sm text-slate-500">Real-time tracking of portfolio income.</p>
            </div>
            <div class="p-8 bg-white/5 border border-white/10 rounded-2xl">
                <div class="text-teal-500 font-bold mb-4">02. CAPEX</div>
                <p class="text-sm text-slate-500">Construction & renovation logs.</p>
            </div>
            <div class="p-8 bg-white/5 border border-white/10 rounded-2xl">
                <div class="text-teal-500 font-bold mb-4">03. VAULT</div>
                <p class="text-sm text-slate-500">Secure document access.</p>
            </div>
        </div>

        <div class="mt-12 p-12 bg-white text-black rounded-3xl">
            <h2 class="text-3xl font-black mb-6 uppercase italic">Request Access</h2>
            <form action="https://formspree.io/f/your_id" method="POST" class="grid md:grid-cols-2 gap-4">
                <input type="text" name="name" placeholder="Full Name" required class="p-4 border-b-2 border-black focus:outline-none">
                <input type="email" name="email" placeholder="Professional Email" required class="p-4 border-b-2 border-black focus:outline-none">
                <button class="md:col-span-2 bg-black text-white font-black py-5 uppercase tracking-widest hover:bg-teal-600 transition">Initialize Audit</button>
            </form>
        </div>
    </main>

</body>
</html>
