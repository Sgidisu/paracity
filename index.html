<section class="max-w-5xl mx-auto py-12 px-6">
    <div class="flex gap-4 mb-8 border-b border-white/10 overflow-x-auto pb-4">
        <button onclick="showTab('audit')" class="text-teal-500 font-bold uppercase tracking-widest text-xs">01. Investor Audit</button>
        <button onclick="showTab('valuation')" class="text-slate-500 hover:text-white font-bold uppercase tracking-widest text-xs">02. Asset Valuation</button>
        <button onclick="showTab('roadmap')" class="text-slate-500 hover:text-white font-bold uppercase tracking-widest text-xs">03. ITIN Roadmap</button>
    </div>

    <div id="audit" class="tab-content">
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10">
            <h3 class="text-2xl font-bold mb-4">Portfolio NOI Tracker</h3>
            <p class="text-slate-400 text-sm">Real-time transparency for the Newark asset cluster.</p>
        </div>
    </div>

    <div id="valuation" class="tab-content hidden">
        <div class="bg-white/5 p-8 rounded-2xl border border-teal-500/30">
            <h3 class="text-2xl font-bold mb-6">Quick Cap Rate Analysis</h3>
            <div class="grid gap-4">
                <input type="number" id="noi" placeholder="Net Operating Income ($)" class="bg-black border border-white/20 p-3 rounded text-white">
                <input type="number" id="price" placeholder="Purchase Price ($)" class="bg-black border border-white/20 p-3 rounded text-white">
                <button onclick="calcCap()" class="bg-teal-600 p-3 font-bold uppercase text-xs">Calculate Cap Rate</button>
                <div id="result" class="text-teal-500 font-black text-2xl mt-4"></div>
            </div>
        </div>
    </div>

    <div id="roadmap" class="tab-content hidden">
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10">
            <h3 class="text-2xl font-bold mb-4 italic text-teal-500">ITIN Investment Strategy</h3>
            <ul class="text-slate-400 text-sm space-y-4">
                <li><strong class="text-white">Phase 1:</strong> Compliance & IRS W-7 Filings</li>
                <li><strong class="text-white">Phase 2:</strong> Newark Opportunity Zone Selection</li>
                <li><strong class="text-white">Phase 3:</strong> Institutional Equity Deployment</li>
            </ul>
        </div>
    </div>
</section>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function calcCap() {
        const noi = document.getElementById('noi').value;
        const price = document.getElementById('price').value;
        if(noi && price) {
            const cap = ((noi / price) * 100).toFixed(2);
            document.getElementById('result').innerText = `Target Cap Rate: ${cap}%`;
        }
    }
</script>
