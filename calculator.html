<div class="max-w-4xl mx-auto my-12 p-6 bg-gray-50 rounded-2xl border border-gray-200 shadow-sm font-sans">
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-900">Commercial Asset Valuation</h2>
    <p class="text-gray-600">Estimate property value based on Net Operating Income and Market Cap Rates.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="space-y-6">
      <div>
        <label for="noi" class="block text-sm font-semibold text-gray-700 mb-2">Annual Net Operating Income (NOI)</label>
        <div class="relative">
          <span class="absolute left-3 top-2 text-gray-400">$</span>
          <input type="number" id="noi" class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="500,000">
        </div>
      </div>

      <div>
        <label for="capRate" class="block text-sm font-semibold text-gray-700 mb-2">Market Cap Rate (%)</label>
        <div class="relative">
          <input type="number" id="capRate" step="0.1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="5.5">
          <span class="absolute right-3 top-2 text-gray-400">%</span>
        </div>
      </div>
    </div>

    <div class="flex flex-col justify-center items-center p-8 bg-blue-900 rounded-xl text-white shadow-inner">
      <span class="text-blue-200 uppercase tracking-widest text-xs font-bold mb-2">Estimated Asset Value</span>
      <div id="valuationDisplay" class="text-4xl md:text-5xl font-extrabold mb-4">$0</div>
      <button class="mt-4 px-6 py-2 bg-white text-blue-900 font-bold rounded-full hover:bg-blue-50 transition-colors shadow-md">
        Download Full Report
      </button>
    </div>
  </div>
</div>

<script>
const noiInput = document.getElementById('noi');
const capInput = document.getElementById('capRate');
const display = document.getElementById('valuationDisplay');

function updateValuation() {
    const noi = parseFloat(noiInput.value);
    const capRate = parseFloat(capInput.value) / 100;

    if (noi > 0 && capRate > 0) {
        const valuation = noi / capRate;
        display.innerText = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            maximumFractionDigits: 0
        }).format(valuation);
    } else {
        display.innerText = "$0";
    }
}

noiInput.addEventListener('input', updateValuation);
capInput.addEventListener('input', updateValuation);
</script>
