<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Valuation | Paracity Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden border border-slate-200">
        <div class="bg-teal-800 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Asset Valuation & Sensitivity Analysis</h1>
            <p class="text-teal-100 text-sm">Professional Institutional Analysis Tool</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Annual Net Operating Income ($)</label>
                    <input type="number" id="noi" value="500000" oninput="calculate()" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Target Cap Rate (%)</label>
                    <input type="number" id="cap" value="6.0" step="0.1" oninput="calculate()" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition-all">
                </div>
            </div>

            <div class="bg-slate-100 p-6 rounded-xl border border-slate-200 text-center">
                <span class="text-slate-500 uppercase tracking-wider text-xs font-bold">Base Case Valuation</span>
                <div id="base-val" class="text-4xl font-black text-teal-900 mt-2">$8,333,333</div>
            </div>

            <form action="http://100.115.92.201:5000/submit" method="POST" class="pt-6 border-t border-slate-100 space-y-4">
                <h3 class="text-lg font-semibold text-slate-800">Secure This Valuation Report</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="name" placeholder="Full Name" required class="p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500">
                    <input type="email" name="email" placeholder="Email Address" required class="p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500">
                </div>
                <input type="hidden" name="interest" value="Commercial Asset Valuation">
                <button type="submit" class="w-full bg-teal-700 text-white font-bold py-4 rounded-lg hover:bg-teal-800 transition-all shadow-lg transform hover:-translate-y-1">
                    Schedule Consultation
                </button>
            </form>
        </div>
    </div>

    <script>
        function calculate() {
            const noi = parseFloat(document.getElementById('noi').value);
            const cap = parseFloat(document.getElementById('cap').value) / 100;
            
            if (noi && cap && cap !== 0) {
                const valuation = noi / cap;
                document.getElementById('base-val').innerText = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    maximumFractionDigits: 0
                }).format(valuation);
            } else {
                document.getElementById('base-val').innerText = "—";
            }
        }
    </script>
</body>
</html>
