<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Paracity | Cap Rate Calculator</title>
</head>
<body class="bg-slate-50 p-6 md:p-12 font-sans">

<nav class="max-w-4xl mx-auto mb-8 flex justify-between items-center">
    <div class="text-xl font-bold tracking-tighter text-slate-900">PARA<span class="text-blue-600">CITY</span></div>
    <a href="index.html" class="text-sm font-bold text-slate-600 hover:text-blue-600">← Back to Portal</a>
</nav>

<div class="max-w-4xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-xl overflow-hidden">
  <div class="p-8 border-b border-gray-100 bg-white">
    <h2 class="text-2xl font-bold text-gray-900">Asset Valuation & Sensitivity Analysis</h2>
    <p class="text-gray-500 text-sm">Professional grade tool for institutional real estate analysis.</p>
  </div>

  <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8 border-b border-gray-100">
    <div class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Annual Net Operating Income ($)</label>
        <input type="number" id="noi" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" placeholder="500000" value="500000">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Target Cap Rate (%)</label>
        <input type="number" id="capRate" step="0.01" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" placeholder="5.5" value="5.5">
      </div>
    </div>

    <div class="flex flex-col justify-center p-8 bg-blue-900 rounded-xl text-white">
      <span class="text-blue-200 uppercase tracking-widest text-xs font-bold mb-2 text-center">Base Case Valuation</span>
      <div id="valuationDisplay" class="text-4xl md:text-5xl font-extrabold mb-6 text-center">$9,090,909</div>
      
      <form action="http://127.0.0.1:5000/submit" method="POST" class="space-y-3">
          <input type="hidden" name="interest" value="Cap Rate Consultation">
          <input type="text" name="name" placeholder="Full Name" required class="w-full p-2 bg-blue-800 border border-blue-700 rounded text-sm text-white placeholder-blue-300 focus:outline-none">
          <input type="email" name="email" placeholder="Email Address" required class="w-full p-2 bg-blue-800 border border-blue-700 rounded text-sm text-white placeholder-blue-300 focus:outline-none">
          <button type="submit" class="w-full py-3 bg-white text-blue-900 font-bold rounded-lg hover:bg-blue-50 transition shadow-md">
            Save Valuation & Consult
          </button>
      </form>
    </div>
  </div>

  <div class="p-8 bg-gray-50">
    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Market Sensitivity (+/- 0.50% Cap Shift)</h3>
    <div class="grid grid-cols-3 gap-4 text-center">
      <div class="p-4 bg-white rounded-lg border border-gray-200">
        <p class="text-[10px] text-gray-500 uppercase mb-1">-0.50% (Bull)</p>
        <p id="bestCase" class="text-lg font-bold text-emerald-600">$10,000,000</p>
      </div>
      <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
        <p class="text-[10px] text-blue-500 uppercase mb-1">Market Base</p>
        <p id="baseCaseTable" class="text-lg font-bold text-blue-900">$9,090,909</p>
      </div>
      <div class="p-4 bg-white rounded-lg border border-gray-200">
        <p class="text-[10px] text-gray-500 uppercase mb-1">+0.50% (Bear)</p>
        <p id="worstCase" class="text-lg font-bold text-red-600">$8,333,333</p>
      </div>
    </div>
  </div>
</div>

<script>
const noiInput = document.getElementById('noi');
const capInput = document.getElementById('capRate');
const display = document.getElementById('valuationDisplay');
const bestCaseDisplay = document.getElementById('bestCase');
const baseCaseTable = document.getElementById('baseCaseTable');
const worstCaseDisplay = document.getElementById('worstCase');

function formatCurrency(val) {
    if (!isFinite(val) || val <= 0) return "$0";
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
}

function calculate() {
    const noi = parseFloat(noiInput.value);
    const cap = parseFloat(capInput.value) / 100;

    if (noi > 0 && cap > 0) {
        const baseVal = noi / cap;
        display.innerText = formatCurrency(baseVal);
        baseCaseTable.innerText = formatCurrency(baseVal);
        
        // Sensitivity Logic
        bestCaseDisplay.innerText = formatCurrency(noi / (cap - 0.005));
        worstCaseDisplay.innerText = formatCurrency(noi / (cap + 0.005));
    }
}

// Event Listeners
noiInput.addEventListener('input', calculate);
capInput.addEventListener('input', calculate);

// Run on load to avoid $0 display
window.onload = calculate;
</script>

</body>
</html>
