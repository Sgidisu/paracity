<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap Rate Calculator | Paracity Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold mb-4 text-teal-700">Lead Capture Test</h2>
        <form action="http://100.115.92.201:5000/submit" method="POST" class="space-y-4">
            <input type="text" name="name" placeholder="Full Name" class="w-full p-2 border rounded" required>
            <input type="email" name="email" placeholder="Email Address" class="w-full p-2 border rounded" required>
            <input type="hidden" name="interest" value="Cap Rate Consultation">
            <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded font-bold hover:bg-teal-700">Schedule Consultation</button>
        </form>
    </div>
</body>
</html>
